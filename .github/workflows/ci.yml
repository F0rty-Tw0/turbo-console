name: CI

# Diag branch only (F-U7-17): a probe-only copy of ci.yml, dispatched with
# `gh workflow run ci.yml --ref diag/fu717-turbo-exit-probe`. Arm A = turbo's default local:rw cache, arm B = --cache=local:r.
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Unused on the diag branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arm: [A, B]
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      # SHA = actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # SHA = pnpm/action-setup@v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # SHA = actions/setup-node@v7.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same as ci.yml: the contract spec's fixtures live under runner.temp (D:).
      - name: Move Windows temp dirs to runner.temp
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Build repo-gen
        run: pnpm turbo run build --filter=@turbo-console/repo-gen

      - name: Probe
        env:
          PROBE_ARM: ${{ matrix.arm }}
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_MINUTES: '25'
          PROBE_CONCURRENCY: '4'
          PROBE_GIT_SPAWNS: ${{ matrix.arm == 'A' && matrix.shard == 1 && '3000' || '0' }}
          PROBE_OUT: ${{ runner.temp }}/probe-out
        run: node packages/core/diag/turbo-exit-probe.ts

      # SHA = actions/upload-artifact@v7.0.2
      - name: Upload probe results
        # always(): still uploads when the job hits its timeout mid-probe.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: probe-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/probe-out/
          if-no-files-found: warn
          retention-days: 14
