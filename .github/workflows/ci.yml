name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      # SHA = actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # SHA = pnpm/action-setup@v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # SHA = actions/setup-node@v7.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Check
        run: pnpm turbo run lint typecheck test build contract e2e

      # SHA = actions/cache@v6.1.0
      - name: Cache VS Code test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('packages/vscode/test/integration.const.ts') }}

      - name: Integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm turbo run integration

      - name: Integration
        if: runner.os != 'Linux'
        run: pnpm turbo run integration
