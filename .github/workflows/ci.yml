name: CI

# Diag branch only (F-U7-17): a probe-only copy of ci.yml, dispatched with
# `gh workflow run ci.yml --ref diag/fu717-turbo-exit-probe`. Round 3 runs arm A only (baseline turboEnv) and, for the
# first 5 killed hangs per shard, saves thread tables, a minidump and cdb stacks (packages/core/diag/deep-capture.ts).
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Unused on the diag branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arm: [A]
        shard: [1, 2, 3]
    runs-on: windows-latest
    # Rounds 1-2 used 40; the extra 10 cover dumps and cdb runs after the 25-minute probe window.
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      # SHA = actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # SHA = pnpm/action-setup@v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # SHA = actions/setup-node@v7.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same as ci.yml: the contract spec's fixtures live under runner.temp (D:).
      - name: Move Windows temp dirs to runner.temp
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Build repo-gen
        run: pnpm turbo run build --filter=@turbo-console/repo-gen

      - name: Check debug tools
        continue-on-error: true
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $isAdmin = ([Security.Principal.WindowsPrincipal]$identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "user=$($identity.Name) elevated=$isAdmin"
          $known = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          "cdb at known path: $(Test-Path $known)"
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\*\Debuggers\x64\cdb.exe', 'C:\Program Files\Windows Kits\*\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb) {
            "cdb found: $($cdb.FullName)"
            "PROBE_CDB=$($cdb.FullName)" >> $env:GITHUB_ENV
          } else {
            'cdb.exe NOT found: hangs keep their first 3 dumps instead of stack.txt'
          }

      - name: Fetch procdump (minidump fallback)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'procdump'
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir -Force
          $exe = Join-Path $dir 'procdump64.exe'
          "procdump64 present: $(Test-Path $exe)"
          if (Test-Path $exe) { "PROBE_PROCDUMP=$exe" >> $env:GITHUB_ENV }

      - name: Probe
        env:
          PROBE_ARM: ${{ matrix.arm }}
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_MINUTES: '25'
          PROBE_CONCURRENCY: '4'
          PROBE_OUT: ${{ runner.temp }}/probe-out
          PROBE_SYMBOL_CACHE: ${{ runner.temp }}\symcache
        run: node packages/core/diag/turbo-exit-probe.ts

      # SHA = actions/upload-artifact@v7.0.2
      - name: Upload probe results
        # always(): still uploads when the job hits its timeout mid-probe.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: probe-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/probe-out/
          if-no-files-found: warn
          retention-days: 14
