name: rss-probe-timing

# Throwaway measurement for C19's probe cost; runs only on its own branch, never merged.
on:
  push:
    branches:
      - perf/rss-probe-timing

permissions:
  contents: read

jobs:
  time:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Time the probe, 3 rounds
        run: |
          node .github/rss-probe-timing.mjs
          node .github/rss-probe-timing.mjs
          node .github/rss-probe-timing.mjs
